<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de productos</title>
</head>
<body>

<div th:replace="~{fragments/general :: menu}"></div>

<main>
    <h1>Catálogo de productos</h1>

    <p th:if="${mensaje != null}"
       th:text="${mensaje}"
       style="color: green;"></p>

    <p th:if="${error != null}"
       th:text="${error}"
       style="color: red;"></p>

    <a th:href="@{/productos/nuevo}">Registrar producto</a>

    <br><br>

    <table border="1" cellpadding="8">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio (S/)</th>
            <th>Stock disponible</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${#lists.isEmpty(productos)}">
            <td colspan="5">No hay productos registrados.</td>
        </tr>

        <tr th:each="producto : ${productos}">
            <td th:text="${producto.id}"></td>
            <td th:text="${producto.name}"></td>

            <td th:text="${#numbers.formatDecimal(
                    producto.price, 1, 'COMMA', 2, 'POINT')}"></td>

            <td th:text="${producto.stock}"></td>

            <td>
                <a th:href="@{/productos/editar/{id}(id=${producto.id})}">
                    Editar
                </a>

                <form th:action="@{/productos/eliminar/{id}(id=${producto.id})}"
                      method="post"
                      style="display: inline;">
                    <button type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
