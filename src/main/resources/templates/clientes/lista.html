<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
</head>
<body>

<div th:replace="~{fragments/general :: menu}"></div>

<main>
    <h1>Gestión de clientes</h1>

    <p th:if="${mensaje != null}"
       th:text="${mensaje}"
       style="color: green;"></p>

    <p th:if="${error != null}"
       th:text="${error}"
       style="color: red;"></p>

    <a th:href="@{/clientes/nuevo}">Registrar cliente</a>

    <br><br>

    <table border="1" cellpadding="8">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Tipo de documento</th>
            <th>Número de documento</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${#lists.isEmpty(clientes)}">
            <td colspan="5">No hay clientes registrados.</td>
        </tr>

        <tr th:each="cliente : ${clientes}">
            <td th:text="${cliente.id}"></td>
            <td th:text="${cliente.name}"></td>
            <td th:text="${cliente.documentType}"></td>
            <td th:text="${cliente.document}"></td>

            <td>
                <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}">
                    Editar
                </a>

                <form th:action="@{/clientes/eliminar/{id}(id=${cliente.id})}"
                      method="post"
                      style="display: inline;">
                    <button type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
