<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de cliente</title>
</head>
<body>

<div th:replace="~{fragments/general :: menu}"></div>

<main>
    <h1 th:text="${customer.id == null
                  ? 'Registrar cliente'
                  : 'Editar cliente'}">
        Formulario de cliente
    </h1>

    <form th:action="@{/clientes/guardar}"
          th:object="${customer}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div>
            <label for="name">Nombre:</label>
            <input type="text" th:field="*{name}">

            <p th:if="${#fields.hasErrors('name')}"
               th:errors="*{name}"
               style="color: red;"></p>
        </div>

        <br>

        <div>
            <label for="documentType">Tipo de documento:</label>

            <select th:field="*{documentType}">
                <option value="">Seleccione</option>
                <option value="DNI">DNI</option>
                <option value="RUC">RUC</option>
            </select>

            <p th:if="${#fields.hasErrors('documentType')}"
               th:errors="*{documentType}"
               style="color: red;"></p>
        </div>

        <br>

        <div>
            <label for="document">Número de documento:</label>
            <input type="text" th:field="*{document}">

            <p th:if="${#fields.hasErrors('document')}"
               th:errors="*{document}"
               style="color: red;"></p>
        </div>

        <br>

        <button type="submit">Guardar</button>
        <a th:href="@{/clientes}">Cancelar</a>
    </form>
</main>

</body>
</html>
